<style>
:root{--red:#922B21;--bg:#f4f5f7;--line:#d9dde4;--ink:#1d2330;--mut:#6b7280;--zeb:#f4f8fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.25)}
h1{margin:0 0 8px;font-size:19px}
h1 small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1 1 100%;min-width:0;width:100%;border:0;border-radius:10px;padding:13px 14px;font-size:18px;outline:none}
.bar select,.bar button{flex:1 1 120px;min-width:0;border:0;border-radius:10px;padding:11px 10px;font-size:16px;background:#fff;color:#222}
.bar button{background:rgba(255,255,255,.2);color:#fff;font-weight:700;cursor:pointer}
.count{padding:10px 14px 0;color:var(--mut);font-size:14px;max-width:1100px;margin:0 auto}
main{max-width:1100px;margin:0 auto;padding:8px 10px 50px}
.loc{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.lh{background:var(--red);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}
.lh{flex-wrap:wrap}.lh span{min-width:0;overflow-wrap:anywhere}.lh span:last-child{font-weight:500;opacity:.9}
.row{display:grid;grid-template-columns:2.2fr .8fr .9fr .8fr .8fr .8fr .9fr;gap:6px;padding:7px 12px;align-items:center;border-top:1px solid var(--line);font-size:15px}
.hd{background:#eceef2;font-size:12px;font-weight:700;color:#4b5563;text-transform:uppercase;border-top:0}
.row:nth-child(even):not(.hd){background:var(--zeb)}
.c{text-align:center}
.mut{color:var(--mut)}
.lx{padding:8px 12px;background:#fff8e8;border-top:1px solid var(--line)}
.acc{display:inline-block;font-weight:700;font-size:14px;margin-bottom:6px}
.acc b{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:1px 9px;margin-left:6px;background:#e5e7eb}
.acc b.si{background:#d9f2e3;color:#157347}.acc b.no{background:#fbdcdc;color:#a11d1d}.acc b.q{background:#fdecc8;color:#8a5a00}
.lx label{display:block;font-size:12px;font-weight:700;color:#6b4e00;text-transform:uppercase;margin-bottom:3px}
.lx textarea{width:100%;min-height:48px;border:1px solid #e0cf9a;border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical;background:#fff}
.lsum{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--red);color:#fff;padding:13px 14px;font:inherit;font-weight:700;font-size:16px;text-align:left;cursor:pointer}
.lsum .lm{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.lsum .ar{transition:transform .15s;font-size:15px}
.loc.open .lsum .ar{transform:rotate(90deg)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.dot.rec{background:#ff5a5a}.dot.man{background:#ffc83d}
.lbody[hidden]{display:none}
.lm2{padding:8px 12px;color:var(--mut);font-size:13.5px;background:#fafbfc;border-bottom:1px solid var(--line)}
.gh{margin:18px 2px 4px;font-weight:800;color:var(--red);font-size:15px;text-transform:uppercase;letter-spacing:.3px}
.gh span{color:var(--mut);font-weight:600}
.row.r-rec{box-shadow:inset 5px 0 0 #d33;background:#fff4f4!important}
.row.r-man{box-shadow:inset 5px 0 0 #e0a100;background:#fffaec!important}
.row.r-ok{box-shadow:inset 5px 0 0 #2e9e5b;background:#f2fbf5!important}
.stt{display:block;font-size:11.5px;font-weight:700;line-height:1.1}
.stt.rec{color:#a11d1d}.stt.man{color:#8a5a00}.stt.ok{color:#157347}
.ti{margin-right:3px}
.leg{padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line)}
.accb{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.accb button{border:2px solid #d4c58f;background:#fff;color:#5b4a00;border-radius:999px;padding:3px 14px;font-size:14px;font-weight:700;cursor:pointer;min-width:46px}
.accb button.on.si{background:#157347;border-color:#157347;color:#fff}.accb button.on.no{background:#a11d1d;border-color:#a11d1d;color:#fff}.accb button.on.q{background:#8a5a00;border-color:#8a5a00;color:#fff}
.accn{font-size:12px;color:#6b4e00;font-weight:500;margin-left:6px}
.sv{font-size:11px;color:#157347;margin-left:8px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:17px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:22px}
.row>.y,.row>.t{display:none}
@media(max-width:700px){
  header{position:static}
  .hd{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"u t" "y y";gap:2px 8px;padding:9px 12px}
  .row>.u{grid-area:u;font-weight:600;min-width:0;overflow-wrap:anywhere}
  .row>.t{grid-area:t;font-weight:700;text-align:right;display:block}
  .row>.y{grid-area:y;color:var(--mut);font-size:13px;display:block}
  .row>.d{display:none}
}
@media(max-width:700px){
  html,body{font-size:18px}
  .row{font-size:17px}.row>.y{font-size:14.5px}
  .lsum{font-size:18px;padding:16px 14px}
  .bar input{font-size:19px}.bar select,.bar button{font-size:17px}
  .ct{font-size:16px}.lx textarea{font-size:17px}.accb button{font-size:16px;padding:5px 16px}
  .big b{font-size:22px}.it b{font-size:18px}
}
@media print{.lbody[hidden]{display:block!important}.lx textarea{border:0;padding:0;background:none;resize:none}header{position:static;background:#fff;color:#000;box-shadow:none}.bar{display:none}.loc{break-inside:avoid}.lh{background:#ddd;color:#000}}

.home{display:flex;flex-direction:column;gap:14px;padding:18px 4px}
.big{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i b" "i s";column-gap:14px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;font:inherit;color:var(--ink)}
.big:hover{border-color:var(--red)}
.big .ic{grid-area:i;font-size:38px}.big b{grid-area:b;font-size:21px}.big small{grid-area:s;color:var(--mut);font-size:14px}
.it{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 14px;margin:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.it b{display:block;font-size:17px}.it small{color:var(--mut);font-size:14px}.it:hover{border-color:var(--red)}
.bk{flex:1 1 100%;text-align:left;border:0;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:16px;padding:10px 12px;border-radius:10px;cursor:pointer}
.bar:empty{display:none}
.ct{padding:9px 12px;background:#eef4fb;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.ct h4{margin:0 0 4px;font-size:12px;color:#1f4e8c;text-transform:uppercase;letter-spacing:.3px}
.ct a{color:#1f4e8c;font-weight:600;word-break:break-all}
.ct .k{color:var(--mut)}
.ct button{background:#1f4e8c;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.ct .er{color:#a11d1d;font-size:13px;margin-top:4px}

@media print{.ver{display:none}}

const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIGLAS=['KFC','GUS','CAFA'];
const tc=s=>SIGLAS.includes(s)?s:String(s).toLowerCase().replace(/(^|[\s\/])([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
const $=s=>document.querySelector(s);
const E=DATA.extintores; // [marca,codigo,nombre,mes,ubic,tipo,cap,ult,m1,m2,prox]
const locs=[];const idx={};
const KEY='kfc_obs_v1';
let OBS={};try{OBS=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
Object.keys(OBS).forEach(k=>{if(typeof OBS[k]==='string')OBS[k]={t:OBS[k],d:null}});
const fdate=d=>{if(!d)return'';const x=new Date(d);return x.toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+x.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})};
const saveObs=()=>{try{localStorage.setItem(KEY,JSON.stringify(OBS));return true}catch(e){return false}};
const CFG=DATA.cfg||{};const SHARED=!!CFG.obs_url;
async function api(method,body){
  const u=CFG.obs_url+(method==='GET'?'?k='+encodeURIComponent(CFG.app_key):'');
  const r=await fetch(u,method==='GET'?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({k:CFG.app_key},body))});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function pushPend(){for(const k of Object.keys(OBS)){const o=OBS[k];if(o&&o.p){try{await api('POST',{action:'put',id:k,text:o.t});delete o.p}catch(e){}}}saveObs()}
async function pull(){
  if(!SHARED)return false;
  try{await pushPend();const j=await api('GET');const srv=j.items||{};const nu={};
    for(const k in srv)nu[k]={t:srv[k].t,d:srv[k].d};
    for(const k in OBS){const o=OBS[k];if(o&&(o.p||(!srv[k]&&o.d&&Date.now()-new Date(o.d)<120000)))nu[k]=o}
    const ch=JSON.stringify(nu)!==JSON.stringify(OBS);OBS=nu;saveObs();return ch;
  }catch(e){return false}
}
const accBase=l=>l.acc||'?';
const accOv=l=>{const o=OBS['ACC_'+l.id];return o&&o.t?o.t:null};
const accVal=l=>accOv(l)||accBase(l);
function accHtml(l){const v=accVal(l),ov=accOv(l)!==null&&accOv(l)!==accBase(l);
  const b=(x,t,c)=>`<button data-acc="${esc(l.id)}" data-v="${x}" class="${c}${v===x?' on':''}">${t}</button>`;
  return `<div class="acc">Acc. distancia:<span class="accb">${b('SI','Sí','si')}${b('NO','No','no')}${b('?','?','q')}</span><span class="accn" data-accn="${esc(l.id)}">${ov?'(pendiente de confirmar)':''}</span></div>`}
async function setAcc(id,v){
  const l=byId[id];if(!l)return;const k='ACC_'+id;
  if(v===accBase(l))delete OBS[k];else OBS[k]={t:v,d:new Date().toISOString(),p:SHARED?1:undefined};
  saveObs();
  document.querySelectorAll('[data-acc="'+id.replace(/"/g,'')+'"]').forEach(b=>b.classList.toggle('on',b.dataset.v===accVal(l)));
  document.querySelectorAll('[data-accn="'+id.replace(/"/g,'')+'"]').forEach(n=>n.textContent=accOv(l)!==null?'(pendiente de confirmar)':'');
  if(SHARED){try{await api('POST',{action:'put',id:k,text:OBS[k]?OBS[k].t:''});if(OBS[k])delete OBS[k].p;saveObs()}catch(e){}}
}
const SEC=DATA.sec||{};
const Y=new Date().getFullYear();
const est=e=>e.y[3]<=Y?'rec':(e.y[1]===Y||e.y[2]===Y)?'man':(e.y[0]===Y?'ok':'');
const STXT={rec:'Toca recarga',man:'Toca mantenimiento',ok:'Recargado este año'};
const ICO={'PQS':'🧯','CO2':'❄️','TIPO K':'🍳'};const ic=t=>ICO[t]||'🧯';
const lev=(a,b,max)=>{if(Math.abs(a.length-b.length)>max)return max+1;let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];let mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur[j]=v;if(v<mn)mn=v}if(mn>max)return max+1;prev=cur}return prev[b.length]};
const okey=l=>l.codigo==='PENDIENTE'?l.nombre:l.codigo;
E.forEach(r=>{let l=idx[r[2]];if(!l){l=idx[r[2]]={marca:r[0],codigo:r[1],nombre:r[2],mes:r[3],acc:(DATA.acc||{})[r[2]]||'?',ext:[]};locs.push(l)}
  l.ext.push({u:r[4],t:r[5],c:r[6],y:[r[7],r[8],r[9],r[10]],b:norm([r[0],r[2],r[3],r[4],r[5],r[6],r[7],r[8],r[9],r[10]].join(' '))})});
locs.forEach(l=>{l.id=okey(l);l.flat=norm(l.nombre+l.marca+l.mes).replace(/\s+/g,'');l.toks=[...new Set(norm(l.nombre+' '+l.marca+' '+l.mes+' '+l.ext.map(e=>e.u+' '+e.t+' '+e.c).join(' ')).split(/[^a-z0-9]+/).filter(x=>x.length>=3))];l.blob=norm([l.marca,l.codigo,l.nombre,l.mes].join(' '));l.full=l.blob+' '+l.ext.map(e=>e.b).join(' ')});
const marcas=[...new Set(locs.map(l=>l.marca))];
const byId={};locs.forEach(l=>byId[l.id]=l);
$('#sub').textContent=`${locs.length} locales · ${E.length} extintores · actualizado ${DATA.actualizado}`;


// ---- contactos cifrados (clave una sola vez por aparato)
let CONT=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function descifrar(clave){
  const raw=b64(CIFRADO),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(clave).toLowerCase().replace(/\s+/g,'')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function abrirContactos(clave,silencioso){
  try{CONT=await descifrar(clave);try{localStorage.setItem('kfc_clave',String(clave).toLowerCase().replace(/\s+/g,''))}catch(e){}return true}
  catch(e){CONT=null;if(!silencioso)alert('La clave no es correcta. Revisa que no estén las MAYÚSCULAS activadas, o abre el enlace que te mandó Alejandro.');try{if(silencioso)localStorage.removeItem('kfc_clave')}catch(e){}return false}
}
const tel=t=>t?`<a href="tel:${esc(t.replace(/[^\d+]/g,''))}">${esc(t)}</a>`:'';
const mail=m=>m?`<a href="mailto:${esc(m)}">${esc(m)}</a>`:'';
function ctBlock(l){
  if(!CIFRADO)return'';
  if(!CONT)return `<div class="ct"><button data-unlock="1">🔒 Ver datos de contacto del local</button></div>`;
  const c=CONT[l.id];
  if(!c)return `<div class="ct"><h4>Datos de contacto</h4><span class="k">No hay datos de contacto de este local.</span></div>`;
  const ln=[];
  if(c.c)ln.push(`<span class="k">Correo del local:</span> ${mail(c.c)}`);
  if(c.g)ln.push(`<span class="k">Gerente de operaciones:</span> <b>${esc(c.g.n||'')}</b>${c.g.e?' · '+mail(c.g.e):''}`);
  if(c.tl)ln.push(`<span class="k">Celular del local:</span> ${tel(c.tl)}`);
  if(c.rg||c.z)ln.push(`<span class="k">Región:</span> ${esc(c.rg||'')}${c.z?' · zona '+esc(c.z):''}`);
  return `<div class="ct"><h4>Datos de contacto</h4>${ln.join('<br>')}</div>`;
}

function localBody(l,rows){
  rows=rows||l.ext;
  return `<div class="lm2">${esc(tc(l.marca))} · ${tc(l.mes)} · ${l.ext.length} ${l.ext.length==1?'extintor':'extintores'}</div>
  <div class="lx">${accHtml(l)}<label for="o_${esc(l.id)}">Observación <span class="od" data-od="${esc(l.id)}">${OBS[l.id]&&OBS[l.id].d?'escrita '+fdate(OBS[l.id].d):''}</span> <span class="sv" data-sv="${esc(l.id)}"></span></label><textarea id="o_${esc(l.id)}" data-k="${esc(l.id)}" placeholder="Escribe aquí una observación para este local…">${esc((OBS[l.id]||{}).t||'')}</textarea></div>
  ${ctBlock(l)}
  <div class="row hd"><span>Ubicación</span><span class="c">Tipo</span><span class="c">Capacidad</span><span class="c">Últ. recarga</span><span class="c">Mant. 1</span><span class="c">Mant. 2</span><span class="c">Próx. recarga</span></div>`+
  rows.map(e=>{const st=est(e);return `<div class="row${st?' r-'+st:''}"><span class="u">${esc(e.u)||'<span class="mut">sin ubicación</span>'}</span><span class="t"><span class="ti">${ic(e.t)}</span>${esc(e.t)} ${esc(e.c)}</span><span class="c d"><span class="ti">${ic(e.t)}</span>${esc(e.t)}</span><span class="c d">${esc(e.c)}</span><span class="c d">${e.y[0]}</span><span class="c d">${e.y[1]}</span><span class="c d">${e.y[2]}</span><span class="c d">${e.y[3]}${st?`<span class="stt ${st}">${STXT[st]}</span>`:''}</span><span class="y">Últ. recarga ${e.y[0]} · Mant. ${e.y[1]} y ${e.y[2]} · Próx. recarga <b>${e.y[3]}</b>${st?` · <b class="stt ${st}" style="display:inline">${STXT[st]}</b>`:''}</span></div>`}).join('')+
  `<div class="leg">🟥 Toca recarga · 🟨 Toca mantenimiento · 🟩 Recargado este año</div>`;
}
function cardLocal(l,opts){
  opts=opts||{};
  const rec=l.ext.some(e=>est(e)==='rec'),man=l.ext.some(e=>est(e)==='man');
  return `<section class="loc${opts.open?' open':''}" data-id="${esc(l.id)}"><button class="lsum" data-tg="${esc(l.id)}"><span>${esc(l.nombre)}</span><span class="lm">${rec?'<i class="dot rec"></i>':''}${man?'<i class="dot man"></i>':''}<span class="ar">▸</span></span></button><div class="lbody" ${opts.open?'data-r="1"':'hidden'}>${opts.open?localBody(l):''}</div></section>`;
}
function toggleLoc(sec){const b=sec.querySelector('.lbody');if(!b.dataset.r){b.innerHTML=localBody(byId[sec.dataset.id]);b.dataset.r='1'}b.hidden=!b.hidden;sec.classList.toggle('open',!b.hidden)}
function refreshOpen(){document.querySelectorAll('.loc.open .lbody').forEach(b=>{b.innerHTML=localBody(byId[b.parentNode.dataset.id])})}
function abrirTodo(){document.querySelectorAll('.loc').forEach(sec=>{const b=sec.querySelector('.lbody');if(!b.dataset.r){b.innerHTML=localBody(byId[sec.dataset.id]);b.dataset.r='1'}b.hidden=false;sec.classList.add('open')})}
const NOTA=SHARED?'<div class="foot">Las observaciones le llegan a Alejandro. Cuando las resuelve, desaparecen de la lista.</div>':'<div class="foot">Las observaciones se guardan en este celular o computadora (no se comparten con otros aparatos).</div>';
const back=(txt)=>`<button class="bk" data-go="">← ${txt||'Volver al inicio'}</button>`;

const MES_ACT=MESES[new Date().getMonth()];
let DEF=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEF=e;if(/^(#\/?)?$/.test(location.hash)||location.hash==='#/instalar')route()});
window.addEventListener('appinstalled',()=>{DEF=null;route()});
const STANDALONE=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function instBlock(){
  if(STANDALONE())return'';
  if(DEF)return '<div class="inst"><button id="doInst">📲 Instalar en mi celular</button><p>Queda un ícono en la pantalla, como cualquier app.</p></div>';
  if(IOS)return '<div class="inst"><p><b>Para tenerla como app:</b> toca el botón <b>Compartir</b> (cuadrito con flecha) y luego <b>Añadir a pantalla de inicio</b>.</p></div>';
  return '';
}
function vInicio(){
  $('#bar').innerHTML='';$('#count').textContent='';
  const nm=locs.filter(l=>l.mes===MES_ACT).length;
  const no=Object.keys(OBS).filter(k=>OBS[k]&&OBS[k].t&&byId[k]).length;
  $('#main').innerHTML=`<div class="home">${instBlock()}
    <button class="big" data-go="buscar"><span class="ic">🔍</span><b>Buscar un local</b><small>Escribe el nombre y aparece</small></button>
    <button class="big" data-go="mes"><span class="ic">📅</span><b>Locales de este mes</b><small>${tc(MES_ACT)} · ${nm} ${nm==1?'local':'locales'}</small></button>
    <button class="big" data-go="todos"><span class="ic">📋</span><b>Ver todos los locales</b><small>La lista completa</small></button>
    <button class="big" data-go="marcas"><span class="ic">🏷️</span><b>Ver por marca</b><small>KFC, Juan Valdez, Cajun…</small></button>
    <button class="big sec" data-go="obs"><span class="ic">📝</span><b>Mis observaciones</b><small>${no?no+(no==1?' pendiente':' pendientes'):'Aquí aparecen las que escribas'}</small></button></div>`;
  const bi=$('#doInst');if(bi)bi.addEventListener('click',doInstall);
}
function doInstall(){if(DEF){DEF.prompt();DEF.userChoice.finally(()=>{DEF=null;route()})}}
function vInstalar(){
  $('#bar').innerHTML=back();$('#count').textContent='';
  let h;
  if(STANDALONE())h='<div class="stp"><b>Ya está instalada ✅</b><br>Búscala por su ícono rojo con una K en la pantalla de inicio.</div>';
  else if(DEF)h='<div class="inst"><button id="doInst">📲 Instalar en mi celular</button><p>Toca el botón y luego <b>Instalar</b>.</p></div>';
  else if(IOS)h='<div class="stp"><b>En iPhone:</b><br>1. Toca el botón <b>Compartir</b> (cuadrito con flecha hacia arriba)<br>2. Toca <b>Añadir a pantalla de inicio</b><br>3. Toca <b>Añadir</b></div>';
  else h='<div class="stp"><b>En Android:</b><br>1. Toca los <b>tres puntitos ⋮</b> arriba a la derecha<br>2. Toca <b>Instalar aplicación</b> (o <b>Añadir a pantalla de inicio</b>)<br>3. Toca <b>Instalar</b></div>';
  $('#main').innerHTML='<div class="home">'+h+'</div>';
  const bi=$('#doInst');if(bi)bi.addEventListener('click',doInstall);
}

async function vAdmin(){
  $('#bar').innerHTML=back();$('#count').textContent='';
  let pin=sessionStorage.getItem('kfc_pin')||'';
  if(!SHARED){$('#main').innerHTML='<div class="empty">Las observaciones compartidas aún no están activadas.</div>';return}
  const draw=async()=>{
    let j;try{j=await api('GET')}catch(e){$('#main').innerHTML='<div class="empty">No se pudo conectar.</div>';return}
    const items=Object.entries(j.items||{}).sort((a,b)=>String(b[1].d).localeCompare(String(a[1].d)));
    $('#count').textContent=items.length?`${items.length} pendientes`:'';
    $('#main').innerHTML=items.length?items.map(([k,o])=>{const isA=k.startsWith('ACC_');const lk=isA?k.slice(4):k;const txt=isA?'Acc. distancia: '+(o.t==='SI'?'SÍ':o.t)+'  (cámbialo en el Excel, columna ACC_DISTANCIA)':o.t;return `<div class="it" style="cursor:default"><b>${esc((byId[lk]||{}).nombre||lk)}</b><small>${o.d?(isA?'marcado ':'escrita ')+fdate(o.d):''}</small><span class="pv">${esc(txt)}</span><button class="btnres" data-res="${esc(k)}" style="margin-top:8px;background:#157347;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer">✔ Resuelta (borrar)</button></div>`}).join(''):'<div class="empty">No hay observaciones pendientes. 🎉</div>';
  };
  $('#main').onclick=async e=>{const b=e.target.closest('[data-res]');if(!b)return;
    if(!pin){pin=prompt('PIN de administrador:')||'';if(!pin)return}
    try{await api('POST',{action:'del',id:b.dataset.res,pin});sessionStorage.setItem('kfc_pin',pin);await draw()}
    catch(er){if(er.status===403){pin='';sessionStorage.removeItem('kfc_pin');alert('PIN incorrecto')}else alert('No se pudo borrar. Revisa la conexión.')}};
  await draw();
}

function vMes(){
  $('#bar').innerHTML=`${back()}<button id="prt">Imprimir</button>`;
  const r=locs.filter(l=>l.mes===MES_ACT);
  $('#count').textContent=`${tc(MES_ACT)} · ${r.length} ${r.length==1?'local':'locales'} · ${r.reduce((a,l)=>a+l.ext.length,0)} extintores`;
  const g={};r.forEach(l=>{const k=SEC[l.nombre]||'Otros';(g[k]=g[k]||[]).push(l)});
  $('#main').innerHTML=(r.length?Object.keys(g).sort((a,b)=>a.localeCompare(b,'es')).map(k=>`<div class="gh">${esc(k)} <span>(${g[k].length})</span></div>`+g[k].map(l=>cardLocal(l)).join('')).join(''):'<div class="empty">Este mes no hay locales.</div>')+NOTA;$('#prt').addEventListener('click',()=>{abrirTodo();print()});
}
function vObs(){
  $('#bar').innerHTML=`${back()}<input id="q" type="search" placeholder="Buscar en mis observaciones…" autocomplete="off">`;
  $('#main').innerHTML='<div id="res"></div>';
  const q=$('#q');
  const go=()=>{
    const w=norm(q.value).trim().split(/\s+/).filter(Boolean);
    const items=Object.keys(OBS).filter(k=>OBS[k]&&OBS[k].t&&byId[k]).map(k=>({l:byId[k],o:OBS[k]})).filter(x=>w.every(y=>norm(x.o.t+' '+x.l.nombre).includes(y))).sort((a,b)=>String(b.o.d).localeCompare(String(a.o.d)));
    $('#count').textContent=items.length?`${items.length} ${items.length==1?'observación':'observaciones'}`:'';
    $('#res').innerHTML=items.length?items.map(x=>`<button class="it" data-go="local/${esc(x.l.id)}"><b>${esc(x.l.nombre)}</b><small>${esc(tc(x.l.marca))} · ${x.o.d?'escrita '+fdate(x.o.d):''}</small><span class="pv">${esc(x.o.t)}</span></button>`).join('')+NOTA:`<div class="empty">${w.length?'No hay observaciones con esa palabra.':'Todavía no has escrito observaciones.<br><span class="mut">Entra a un local y escribe en el cuadro amarillo.</span>'}</div>`;
  };
  q.addEventListener('input',go);go();
}

let LASTQ='';
function vBuscar(){
  $('#bar').innerHTML=`${back()}<input id="q" type="search" placeholder="Escribe el nombre del local…  ej: Alborada" autocomplete="off">`;
  $('#main').innerHTML='<div id="res"></div>';
  const q=$('#q');q.value=LASTQ;
  const go=()=>{LASTQ=q.value;
    const w=norm(q.value).trim().split(/\s+/).filter(Boolean);
    if(!w.length){$('#count').textContent='';$('#res').innerHTML='<div class="empty">Escribe el nombre del local arriba.<br><span class="mut">Por ejemplo: alborada, mall del sol, K153</span></div>';return}
    const fq=w.join('');
    let r=locs.filter(l=>w.every(x=>l.full.includes(x))||l.flat.includes(fq));
    if(!r.length)r=locs.filter(l=>w.every(x=>x.length>=3&&(l.full.includes(x)||l.toks.some(t=>lev(t,x,x.length>=7?2:1)<=(x.length>=7?2:1)))));
    $('#count').textContent=`${r.length} ${r.length==1?'local encontrado':'locales encontrados'}`;
    $('#res').innerHTML=r.length?r.slice(0,60).map(l=>cardLocal(l,{open:r.length===1})).join('')+(r.length>60?'<div class="empty">Hay más resultados. Escribe más letras para acotar.</div>':''):'<div class="empty">No encontré ningún local. Prueba con otra palabra.</div>';
  };
  let t;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(go,120)});
  go();setTimeout(()=>q.focus(),50);
}
function vTodos(){
  $('#bar').innerHTML=`${back()}<select id="marca"><option value="">Todas las marcas</option>${marcas.map(m=>`<option value="${esc(m)}">${esc(tc(m))}</option>`).join('')}</select><select id="mes"><option value="">Todos los meses</option>${MESES.map(m=>`<option value="${m}">${tc(m)}</option>`).join('')}</select><button id="prt">Imprimir</button>`;
  const go=()=>{const m=$('#marca').value,me=$('#mes').value;const r=locs.filter(l=>(!m||l.marca===m)&&(!me||l.mes===me));
    $('#count').textContent=`${r.length} locales · ${r.reduce((a,l)=>a+l.ext.length,0)} extintores`;$('#main').innerHTML=r.map(l=>cardLocal(l)).join('')+NOTA};
  $('#marca').addEventListener('change',go);$('#mes').addEventListener('change',go);$('#prt').addEventListener('click',()=>{abrirTodo();print()});go();
}
function vMarcas(){
  $('#bar').innerHTML=back();$('#count').textContent='Toca una marca';
  $('#main').innerHTML=marcas.map(m=>{const n=locs.filter(l=>l.marca===m).length;return `<button class="it" data-go="marca/${encodeURIComponent(m)}"><b>${esc(tc(m))}</b><small>${n} ${n==1?'local':'locales'}</small></button>`}).join('');
}
function vMarca(m){
  $('#bar').innerHTML=`${back('Volver a las marcas').replace('data-go=""','data-go="marcas"')}<button id="prt">Imprimir</button>`;
  const r=locs.filter(l=>l.marca===m);$('#count').textContent=`${tc(m)} · ${r.length} ${r.length==1?'local':'locales'}`;
  $('#main').innerHTML=r.map(l=>cardLocal(l)).join('')+NOTA;$('#prt').addEventListener('click',()=>{abrirTodo();print()});
}
function vLocal(id){
  const l=byId[id];if(!l){location.hash='';return}
  $('#bar').innerHTML=`${back('Volver').replace('data-go=""','data-go="back"')}<button id="prt">Imprimir</button>`;$('#count').textContent='';
  $('#main').innerHTML=cardLocal(l,{open:true})+NOTA;$('#prt').addEventListener('click',()=>{abrirTodo();print()});
}
async function route(skipPull){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('clave/')){const ok=await abrirContactos(h.slice(6),false);location.replace(location.pathname+(ok?'#/':'#/'));return}
  window.scrollTo(0,0);
  if(!h.startsWith('clave/')&&h!=='instalar'&&h!=='admin'){try{localStorage.setItem('kfc_last',h)}catch(e){}}
  if(!skipPull&&SHARED&&(h===''||h==='obs'||h==='admin'))pull().then(ch=>{if(ch&&decodeURIComponent(location.hash.replace(/^#\/?/,''))===h&&!document.activeElement.matches('input,textarea'))route(true)});
  if(h==='mes')vMes();else if(h==='obs')vObs();else if(h==='admin')vAdmin();else if(h==='instalar')vInstalar();else if(h==='buscar')vBuscar();else if(h==='todos')vTodos();else if(h==='marcas')vMarcas();
  else if(h.startsWith('marca/'))vMarca(h.slice(6));else if(h.startsWith('local/'))vLocal(h.slice(6));else vInicio();
}
document.addEventListener('click',async e=>{const tg=e.target.closest('[data-tg]');if(tg){toggleLoc(tg.closest('.loc'));return}
  const ab=e.target.closest('[data-acc]');if(ab){setAcc(ab.dataset.acc,ab.dataset.v);return}
  if(e.target.closest('[data-unlock]')){const k=prompt('Escribe la clave de contactos (solo una vez):');if(k&&await abrirContactos(k,false))refreshOpen();return}
  const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;
  if(g==='back'){history.length>1?history.back():(location.hash='')}else if(g==='')location.hash='';else location.hash='#/'+g.split('/').map((x,i)=>i?encodeURIComponent(decodeURIComponent(x)):x).join('/')});
window.addEventListener('hashchange',()=>route());
const tms={};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const v=e.target.value;if(v.trim())OBS[k]={t:v,d:new Date().toISOString(),p:SHARED?1:undefined};else delete OBS[k];
  clearTimeout(tms[k]);tms[k]=setTimeout(async()=>{let ok=saveObs();let msg=ok?'✓ guardado':'no se pudo guardar';
    if(SHARED){try{await api('POST',{action:'put',id:k,text:v.trim()?v:''});if(OBS[k])delete OBS[k].p;saveObs();msg='✓ enviada a Alejandro'}catch(er){msg='guardada en tu celular, se enviará cuando haya internet'}}
    const el=[...document.querySelectorAll('[data-sv]')].find(x=>x.dataset.sv===k);if(el){el.textContent=msg;const od=[...document.querySelectorAll('[data-od]')].find(x=>x.dataset.od===k);if(od)od.textContent=OBS[k]?'escrita '+fdate(OBS[k].d):'';setTimeout(()=>{el.textContent=''},3500)}},500)});
try{const gk=localStorage.getItem('kfc_clave');if(gk&&CIFRADO)abrirContactos(gk,true).then(ok=>{if(ok)refreshOpen()})}catch(e){}
try{const lr=localStorage.getItem('kfc_last');if(lr&&/^(#\/?)?$/.test(location.hash))history.replaceState(null,'','#/'+lr.split('/').map(encodeURIComponent).join('/'))}catch(e){}
route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#ver').textContent='v'+APP_V;
$('#sub').textContent+=' · v'+APP_V;
try{fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
  const m=t.match(/const APP_V = (\d+)/);
  if(m&&+m[1]>APP_V&&!sessionStorage.getItem('kfc_rl_'+m[1])){sessionStorage.setItem('kfc_rl_'+m[1],'1');location.replace(location.pathname+'?v='+m[1]+location.hash)}
}).catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
